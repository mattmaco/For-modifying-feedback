# Dern Kala (Khruangbin) - section and part plan
# Apply with:
#   python3 tools/feedpak_structure.py <Dern Kala.feedpak> songs/dern-kala/structure.yaml <out.feedpak>
#
# Positions are measure numbers from the song's beat grid ("4+3" = measure 4, beat 4).
# Sections that open with a pickup start on the pickup note, like Two Fish and an
# Elephant does, so looping a section or its first part includes the lead-in.
# Each 8-bar section = four 2-bar parts (one riff cycle each).
#
# Names describe what the GUITAR plays (feedBack shows "main_riff" as "Main Riff 1", ...).
# Old names in brackets.

phrase_arrangements: [lead, bass]

sections:
  - name: chord_stab_intro       # [intro] Bm / B5 / Em stabs
    at: "3"

  - name: main_riff              # [riff_a] open position on the D/A strings
    at: "4+3"                    # starts on the A-B-A pickup in bar 4
    parts: ["7", "9", "11"]

  - name: 7th_fret_riff          # [riff_b] climbs from the 7th fret, B-string hammer/pull, runs back down; 4x
    at: "12+3.5"                 # pickup E (B string, 7th fret)
    parts: ["15", "17", "19"]

  - name: main_riff              # [riff_a]
    at: "20+3"                   # pickup D-E hammer, A
    parts: ["23", "25", "27"]

  - name: double_stop_sixths     # [riff_c] sixths over the G-F#-E-A bass line
    at: "28+3.5"                 # pickup E
    parts: ["31", "33", "35"]

  - name: raked_chords           # [riff_a_chords] bass plays the main riff, guitar rakes F# / Bm shapes
    at: "37"
    parts: ["39", "41", "43"]

  - name: 7th_fret_riff          # [riff_b]
    at: "45"
    parts: ["47", "49", "51"]    # part 4 has the descending fill into the breakdown

  - name: bm7_trill_breakdown    # [breakdown] Bm7 stabs + hammer/pull trill on the G string
    at: "53"
    parts: ["55", "57", "59"]

  - name: sliding_melody         # [riff_c_melody] single-note line with slides, same bass as the sixths
    at: "60+3"                   # pickup F#-E
    parts: ["63", "65", "67"]

  - name: high_main_riff         # [riff_a] the main riff an octave up on the G/B strings
    at: "68+3"                   # pickup B-A on the B string
    parts: ["71", "73", "75"]    # part 4 ends with the slide up + tremolo

  - name: chromatic_outro        # [outro] walk up the A string, then C#7 -> D7
    at: "77"
    parts: ["79"]

  - name: noguitar               # end marker, kept as the standard name
    at: "t220.491"
    phrase: false
