# Two Fish and an Elephant (Khruangbin) - the reference layout
# Extracted from "Khruangbin - Two Fish and an Elephant home_fix_v5.feedpak" with
#   python3 tools/feedpak_extract_structure.py <file> lead
# Re-applying this plan to that file reproduces it byte-for-byte.
#
# Conventions worth copying:
#  - sections and parts start on the pickup note (e.g. "11+3" = beat 4 of bar 11), not the barline
#  - parts are one riff cycle: mostly 2 bars, 1 bar for short answers/turnarounds
#  - repeated sections back to back (solo, solo / verse, verse) are merged into one
#    group by Section Practice, so they act like one long section with more parts
#  - the trailing "noguitar" marker is not a part start
phrase_arrangements: [lead]
sections:
  - name: verse
    at: "4"
    parts: ["5+3", "7+3", "8+3", "9+3"]
  - name: chorus
    at: "11+3"
    parts: ["13+3", "15+3", "17+2", "18+2"]
  - name: verse
    at: "19+3"
    parts: ["21+3", "23+3", "24+3", "25+3"]
  - name: chorus
    at: "27+3"
    parts: ["29+3", "31+3", "33+2", "34+1", "35+3"]
  - name: solo
    at: "36+1"
    parts: ["38+1", "t103.684", "40+1", "41+1", "42+1"]
  - name: solo
    at: "43+1"
    parts: ["44+2", "46+1", "47+1", "48+1", "49+1", "50+1", "51"]
  - name: verse
    at: "52+3"
    parts: ["53+3", "55+3", "56+3", "57+3"]
  - name: verse
    at: "59+3"
    parts: ["61+3", "63+3", "64+3", "65+3"]
  - name: outro
    at: "67+2"
    parts: ["72+3", "76+3"]
  - name: noguitar
    at: "78+2"
    phrase: false
